<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>دڵی کۆسان // OFFLINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Vazirmatn:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root{--g:#00ff9c;--r:#ff2e63;--bg:#020806;--dim:#0b3a29}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font-family:"JetBrains Mono","Vazirmatn",monospace;color:var(--g);display:flex;align-items:center;justify-content:center;padding:16px}
  canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.35}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}

  .term{position:relative;z-index:2;width:100%;max-width:640px;background:rgba(2,12,8,.88);
    border:1px solid var(--g);border-radius:8px;box-shadow:0 0 40px rgba(0,255,156,.25);direction:ltr;text-align:left}
  .bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--dim);font-size:12px;color:#5fbf98}
  .bar i{width:10px;height:10px;border-radius:50%;background:var(--dim);display:block}
  .bar i:first-child{background:var(--r)}
  .bar span{margin-left:auto}
  .body{padding:20px 18px 26px;font-size:14px;line-height:1.8;min-height:330px}
  .ln{white-space:pre-wrap;word-break:break-word}
  .p{color:#5fbf98}
  .err{color:var(--r)}
  .ku{direction:rtl;text-align:right;font-family:"Vazirmatn",sans-serif;font-size:16px;color:#d7ffe9;margin-top:6px}
  .cur{display:inline-block;width:9px;height:16px;background:var(--g);vertical-align:-3px;animation:b 1s steps(1) infinite}
  @keyframes b{50%{opacity:0}}

  .glitch{position:relative;display:block;margin:18px 0 6px;font-family:"Vazirmatn",sans-serif;font-weight:800;
    font-size:clamp(1.8rem,8vw,2.8rem);color:var(--g);text-align:center;direction:rtl;text-shadow:0 0 14px rgba(0,255,156,.7)}
  .glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;overflow:hidden}
  .glitch::before{color:var(--r);animation:gl1 2.6s infinite steps(1);transform:translate(-2px,0)}
  .glitch::after{color:#00cfff;animation:gl2 2.6s infinite steps(1);transform:translate(2px,0)}
  @keyframes gl1{0%,88%,100%{clip-path:inset(0 0 100% 0)}90%{clip-path:inset(20% 0 55% 0)}94%{clip-path:inset(65% 0 10% 0)}}
  @keyframes gl2{0%,90%,100%{clip-path:inset(0 0 100% 0)}92%{clip-path:inset(50% 0 25% 0)}96%{clip-path:inset(8% 0 70% 0)}}
  .hide{opacity:0}

  @media (prefers-reduced-motion:reduce){.glitch::before,.glitch::after,.cur{animation:none}}
</style>
</head>
<body>
<canvas id="m" aria-hidden="true"></canvas>

<main class="term">
  <div class="bar"><i></i><i></i><i></i><span>root@dili-kosan:~</span></div>
  <div class="body" id="out"></div>
</main>

<script>
/* باران وەک ماتریکس */
(function(){
  var c=document.getElementById('m'),x=c.getContext('2d'),f=16,cols,d;
  var ch="01ABCDEF<>/{}[]#$%*+=ئاب٠١٢٣٤٥٦٧٨٩";
  function init(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/f);d=Array(cols).fill(1)}
  init();addEventListener('resize',init);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  setInterval(function(){
    x.fillStyle="rgba(2,8,6,.12)";x.fillRect(0,0,c.width,c.height);
    x.fillStyle="#00ff9c";x.font=f+"px monospace";
    for(var i=0;i<cols;i++){
      x.fillText(ch[Math.floor(Math.random()*ch.length)],i*f,d[i]*f);
      if(d[i]*f>c.height&&Math.random()>.975)d[i]=0;d[i]++;
    }
  },60);
})();

/* تێرمیناڵ */
var out=document.getElementById('out');
var script=[
 {t:'$ ping dili-kosan',c:'p',w:600},
 {t:'Request timed out... 100% packet loss',c:'err',w:500},
 {t:'$ systemctl status dili-kosan.service',c:'p',w:600},
 {t:'● dili-kosan.service — STOPPED (by owner)',c:'err',w:500},
 {t:'$ cat /var/log/last-message',c:'p',w:600},
 {t:'> Connection closed. Thanks for stopping by.',c:'',w:400},
 {glitch:'ماڵپەڕەکە داخراوە'},
 {ku:'ماڵپەڕی «دڵی کۆسان» وەستێنراوە و ئێستا ڕاگیراوە.'}
];
var cur=document.createElement('span');cur.className='cur';
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

function line(o){
  var d=document.createElement('div');
  if(o.glitch){d.className='glitch';d.dataset.text=o.glitch;d.textContent=o.glitch;}
  else if(o.ku){d.className='ku';d.textContent=o.ku;}
  else{d.className='ln '+(o.c||'');}
  out.appendChild(d);return d;
}
function type(el,txt,done){
  if(reduce){el.textContent=txt;return done()}
  var i=0;(function s(){el.textContent=txt.slice(0,++i);el.appendChild(cur);
    i<txt.length?setTimeout(s,22):done()})();
}
function run(n){
  if(n>=script.length){out.appendChild(cur);return}
  var o=script[n],el=line(o);
  if(o.t){type(el,o.t,function(){setTimeout(function(){run(n+1)},reduce?0:(o.w||400))})}
  else{setTimeout(function(){run(n+1)},reduce?0:500)}
}
run(0);
</script>
</body>
</html>
